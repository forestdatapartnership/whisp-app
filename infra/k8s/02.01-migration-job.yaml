apiVersion: batch/v1
kind: Job
metadata:
  name: whisp-db-migrate-${VERSION_SLUG}
  namespace: ${GKE_NAMESPACE}
  labels:
    app: whisp-db-migrate
    version: "${VERSION}"
    env: ${ENVIRONMENT}
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: whisp-app-ksa
      restartPolicy: Never
      containers:
      - name: db-migrate
        image: ${IMAGE_REGISTRY}/whisp-db-migrate:${VERSION}
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: whisp-config
        - secretRef:
            name: whisp-secrets
        env:
        - name: DB_HOST
          value: "cloud-sql-proxy"
        - name: DB_PORT
          value: "5432"

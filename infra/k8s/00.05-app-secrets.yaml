apiVersion: v1
kind: Secret
metadata:
  name: whisp-secrets
  namespace: ${GKE_NAMESPACE}
type: Opaque
data:
  DB_USER: "${APP_DB_USER}"
  DB_PASSWORD: "${APP_DB_PASSWORD}"
  JWT_SECRET: "${APP_JWT_SECRET}"
  KEYCLOAK_CLIENT_SECRET: "${APP_KEYCLOAK_CLIENT_SECRET}"
  EMAIL_USER: "${APP_EMAIL_USER}"
  EMAIL_PASS: "${APP_EMAIL_PASS}"

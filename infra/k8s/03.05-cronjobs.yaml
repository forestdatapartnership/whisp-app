apiVersion: batch/v1
kind: CronJob
metadata:
  name: whisp-release-stuck-jobs
  namespace: ${GKE_NAMESPACE}
  labels:
    app: whisp-release-stuck-jobs
    env: ${ENVIRONMENT}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            deployedAt: "${DEPLOYED_AT}"
        spec:
          serviceAccountName: whisp-app-ksa
          restartPolicy: OnFailure
          containers:
          - name: whisp-release-stuck-jobs
            image: postgres:17-alpine
            command:
            - sh
            - -c
            - |
              export PGPASSWORD="$DB_PASSWORD"
              psql -h cloud-sql-proxy -p 5432 -U "$DB_USER" -d "$DB_NAME" \
                -c "SELECT release_stuck_analysis_jobs();"
            envFrom:
            - configMapRef:
                name: whisp-config
            - secretRef:
                name: whisp-secrets
            env:
            - name: DEPLOYED_AT
              value: "${DEPLOYED_AT}"
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: whisp-anonymize-pii
  namespace: ${GKE_NAMESPACE}
  labels:
    app: whisp-anonymize-pii
    env: ${ENVIRONMENT}
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            deployedAt: "${DEPLOYED_AT}"
        spec:
          serviceAccountName: whisp-app-ksa
          restartPolicy: OnFailure
          containers:
          - name: whisp-anonymize-pii
            image: postgres:17-alpine
            command:
            - sh
            - -c
            - |
              export PGPASSWORD="$DB_PASSWORD"
              psql -h cloud-sql-proxy -p 5432 -U "$DB_USER" -d "$DB_NAME" \
                -c "SELECT target, rows_affected FROM anonymize_expired_pii(${PII_RETENTION_DAYS:-90});"
            envFrom:
            - configMapRef:
                name: whisp-config
            - secretRef:
                name: whisp-secrets
            env:
            - name: DEPLOYED_AT
              value: "${DEPLOYED_AT}"
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: whisp-clean-temp
  namespace: ${GKE_NAMESPACE}
  labels:
    app: whisp-clean-temp
    env: ${ENVIRONMENT}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: whisp-clean-temp
            image: busybox:1.37
            command:
            - sh
            - -c
            - find /app/temp -type f -mmin +10 -delete
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: temp
              mountPath: /app/temp
          volumes:
          - name: temp
            hostPath:
              path: /var/lib/whisp/${GKE_NAMESPACE}
              type: DirectoryOrCreate

apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisp-worker-async
  namespace: ${GKE_NAMESPACE}
  labels:
    app: whisp-worker-async
    env: ${ENVIRONMENT}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisp-worker-async
  template:
    metadata:
      labels:
        app: whisp-worker-async
    spec:
      serviceAccountName: whisp-app-ksa
      containers:
      - name: whisp-worker-async
        image: ${IMAGE_REGISTRY}/whisp-api:${VERSION}
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - exec celery -A src.worker.celery_app worker -Q async --concurrency=4 --without-mingle --without-gossip 2>&1
        envFrom:
        - configMapRef:
            name: whisp-config
        - secretRef:
            name: whisp-secrets
        env:
        - name: DEPLOYED_AT
          value: "${DEPLOYED_AT}"
        - name: EE_HIGH_VOL
          value: "1"
        - name: DB_HOST
          value: "cloud-sql-proxy"
        - name: DB_PORT
          value: "5432"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 4Gi
        volumeMounts:
        - name: temp
          mountPath: /app/temp
          readOnly: false
        - name: gee-credentials
          mountPath: /app/credentials.json
          subPath: credentials.json
          readOnly: true
      volumes:
      - name: temp
        hostPath:
          path: /var/lib/whisp/${GKE_NAMESPACE}
          type: DirectoryOrCreate
      - name: gee-credentials
        secret:
          secretName: whisp-gee-credentials

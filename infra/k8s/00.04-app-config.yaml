# The deploy workflow passes each value through toJSON, so it arrives quoted and stays valid YAML.
apiVersion: v1
kind: ConfigMap
metadata:
  name: whisp-config
  namespace: ${GKE_NAMESPACE}
data:
  DB_NAME: ${APP_DB_NAME}
  DB_MIN_POOL_SIZE: ${APP_DB_MIN_POOL_SIZE}
  DB_MAX_POOL_SIZE: ${APP_DB_MAX_POOL_SIZE}
  KEYCLOAK_ISSUER: ${APP_KEYCLOAK_ISSUER}
  KEYCLOAK_CLIENT_ID: ${APP_KEYCLOAK_CLIENT_ID}
  KEYCLOAK_SCOPE: ${APP_KEYCLOAK_SCOPE}
  EMAIL_SERVICE: ${APP_EMAIL_SERVICE}
  EMAIL_FROM: ${APP_EMAIL_FROM}
  NEXT_PUBLIC_ASYNC_THRESHOLD: ${APP_NEXT_PUBLIC_ASYNC_THRESHOLD}
  CARTO_BASEMAP_KEY: ${APP_CARTO_BASEMAP_KEY}
  MAX_MAP_FEATURES: ${APP_MAX_MAP_FEATURES}
  MAX_REQUEST_BODY_SIZE_KB: ${APP_MAX_REQUEST_BODY_SIZE_KB}
  MAX_PLOT_AREA_HA: ${APP_MAX_PLOT_AREA_HA}
  GEOMETRY_LIMIT_SYNC: ${APP_GEOMETRY_LIMIT_SYNC}
  GEOMETRY_LIMIT_ASYNC: ${APP_GEOMETRY_LIMIT_ASYNC}
  ANALYSIS_TIMEOUT_SYNC_SECONDS: ${APP_ANALYSIS_TIMEOUT_SYNC_SECONDS}
  ANALYSIS_TIMEOUT_ASYNC_SECONDS: ${APP_ANALYSIS_TIMEOUT_ASYNC_SECONDS}
  GEOID_BASE_URL: ${APP_GEOID_BASE_URL}
  GEOID_RESOLVE_CONCURRENCY: ${APP_GEOID_RESOLVE_CONCURRENCY}
  ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS}
  PII_RETENTION_DAYS: ${APP_PII_RETENTION_DAYS}

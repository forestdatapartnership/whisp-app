name: Deploy monitoring

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}

      - name: Deploy
        env:
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export GRAFANA_ADMIN_USER=$(printf '%s' "$GRAFANA_ADMIN_USER" | base64 -w0)
          export GRAFANA_ADMIN_PASSWORD=$(printf '%s' "$GRAFANA_ADMIN_PASSWORD" | base64 -w0)
          for f in infra/monitoring/*.yaml; do
            envsubst '$DEPLOYED_AT $GRAFANA_ADMIN_USER $GRAFANA_ADMIN_PASSWORD' < "$f" | kubectl apply -f -
          done

name: Forum Triage

# Step 2 of 3. Classifies ONE forum question. whisp-library and whisp-map
# belong to other repositories and teams, so they stop at the run summary;
# only whisp-app questions become issues and reach First Look.

on:
  workflow_dispatch:
    inputs:
      question_id:
        description: 'Forum question id (the number in /questions/<id>/...)'
        required: true

concurrency:
  group: forum-triage-${{ inputs.question_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Read the question
        id: question
        env:
          FORUM_ONLY_ID: ${{ inputs.question_id }}
        run: |
          set -euo pipefail
          python .github/scripts/forum_watch.py > question.json
          if [ "$(jq length question.json)" = "0" ]; then
            echo "::error::forum#${{ inputs.question_id }} is not a whisp-tagged question in the feed"
            exit 1
          fi
          jq -r '.[0].title' question.json
          jq -r '.[0].issue_body' question.json > issue_body.md
          {
            echo "title=$(jq -r '.[0].title' question.json)"
            echo "url=$(jq -r '.[0].url' question.json)"
          } >> "$GITHUB_OUTPUT"

      # Calling /v1/messages directly returns 429: a subscription token is
      # throttled on the raw API. This action is the supported path for one.
      - name: Classify
        uses: anthropics/claude-code-action@v1
        with:
          # Forum Watch dispatches this run, so its actor is a bot, which the
          # action rejects unless named. Not '*' -- the repo is public.
          allowed_bots: github-actions[bot]
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 4
            --allowedTools Read,Write
          prompt: |
            Read `question.json` in the working directory. It holds one
            question posted on the Open Foris support forum.

            Classify it into exactly one of these. Do not read the rest of the
            codebase, do not look for the cause, do not propose a fix --
            another workflow does that.

            - **whisp-app** -- the website, the HTTP API surface, geometry
              submission or upload, authentication or API keys, results
              display, export or download. The Next.js UI, FastAPI service,
              Celery workers and PostgreSQL behind them.
            - **whisp-library** -- which Earth Engine datasets exist, adding or
              changing a dataset or map layer, how a risk indicator is
              computed, or the analysis algorithm itself. These belong to the
              separate `openforis-whisp` Python library.
            - **whisp-map** -- the Whisp Map viewer at whisp.earthmap.org: the
              map failing to open or load, what it draws, its basemaps,
              layers, legend, zoom or styling. A separate Earth Map
              application.
            - **unclear** -- genuinely not determinable from the text.

            Be decisive. "Please add dataset X" is whisp-library even when the
            person says "to the Whisp app". "The endpoint returns an error" is
            whisp-app even when the error mentions data. "My plots do not show
            up on the map" is whisp-map, but "the Open in Whisp Map button
            does nothing" is whisp-app.

            Then write `classification.json` in the working directory. That
            file is your entire output -- raw JSON, no markdown fence, nothing
            else:

                {"classification": "whisp-library", "reason": "one sentence"}

      - name: Read the classification
        id: result
        if: always()
        run: |
          set -euo pipefail
          kind=$(jq -r '.classification? // empty' classification.json 2>/dev/null || true)
          echo "classification=${kind:-none}" >> "$GITHUB_OUTPUT"
          cat classification.json 2>/dev/null || echo "(no classification.json written)"

      - name: Open an issue for whisp-app questions
        id: open
        if: steps.result.outputs.classification == 'whisp-app'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh label create forum      --repo "$REPO" --color 0E8A16 \
            --description "Raised on the Open Foris support forum" 2>/dev/null || true
          gh label create whisp-app  --repo "$REPO" --color 1D76DB \
            --description "Belongs to this repository" 2>/dev/null || true

          printf '\n\n---\n\n**Triage:** whisp-app -- %s\n' \
            "$(jq -r '.reason // ""' classification.json)" >> issue_body.md

          issue_url=$(gh issue create --repo "$REPO" \
            --title "[forum] ${{ steps.question.outputs.title }}" \
            --body-file issue_body.md \
            --label forum --label whisp-app)
          echo "Opened $issue_url"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"

          # Dispatched because GITHUB_TOKEN cannot fire `on: issues`.
          gh workflow run first-look.yml \
            --repo "$REPO" \
            --field issue_number="${issue_url##*/}"
          echo "Dispatched first look for ${issue_url##*/}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Forum Triage -- forum#${{ inputs.question_id }}"
            echo ""
            echo "[${{ steps.question.outputs.title }}](${{ steps.question.outputs.url }})"
            echo ""
            echo '```json'
            cat classification.json 2>/dev/null || echo "<no result>"
            echo '```'
            if [ -n "${{ steps.open.outputs.issue_url }}" ]; then
              echo ""
              echo "Issue: ${{ steps.open.outputs.issue_url }}"
            else
              echo ""
              echo "_Not whisp-app (\`${{ steps.result.outputs.classification }}\`) -- no issue opened._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

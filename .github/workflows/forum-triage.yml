name: Forum Triage

# Step 2 of 3. Classifies ONE forum question. whisp-library and whisp-map
# belong to other repositories and teams, so they stop at the run summary;
# only whisp-app questions become issues and reach Code Review.

on:
  workflow_dispatch:
    inputs:
      question_id:
        description: 'Forum question id (the number in /questions/<id>/...)'
        required: true

concurrency:
  group: forum-triage-${{ inputs.question_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Read the question
        id: question
        env:
          FORUM_ONLY_ID: ${{ inputs.question_id }}
        run: |
          set -euo pipefail
          python .github/scripts/forum_watch.py > question.json
          if [ "$(jq length question.json)" = "0" ]; then
            echo "::error::forum#${{ inputs.question_id }} is not a whisp-tagged question in the feed"
            exit 1
          fi
          jq -r '.[0].title' question.json
          jq -r '.[0].issue_body' question.json > issue_body.md
          {
            echo "title=$(jq -r '.[0].title' question.json)"
            echo "url=$(jq -r '.[0].url' question.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Classify
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          cat > rules.txt <<'RULES'
          You classify one question from the Open Foris support forum. Reply
          with raw JSON and nothing else -- no prose, no markdown fence:

              {"classification": "whisp-app", "reason": "one sentence"}

          classification must be exactly one of:

          - whisp-app -- the website, the HTTP API surface, geometry
            submission or upload, authentication or API keys, results display,
            export or download. The Next.js UI, FastAPI service, Celery
            workers and PostgreSQL behind them.
          - whisp-library -- which Earth Engine datasets exist, adding or
            changing a dataset or map layer, how a risk indicator is computed,
            or the analysis algorithm itself. These belong to the separate
            openforis-whisp Python library.
          - whisp-map -- the Whisp Map viewer at whisp.earthmap.org: the map
            failing to open or load, what it draws, its basemaps, layers,
            legend, zoom or styling. A separate Earth Map application.
          - unclear -- genuinely not determinable from the text.

          Be decisive. "Please add dataset X" is whisp-library even when the
          person says "to the Whisp app". "The endpoint returns an error" is
          whisp-app even when the error mentions data. "My plots do not show up
          on the map" is whisp-map, but "the Open in Whisp Map button does
          nothing" is whisp-app.
          RULES

          content=$(printf 'Title: %s\n\n%s' \
            "$(jq -r '.[0].title' question.json)" \
            "$(jq -r '.[0].body'  question.json)")

          jq -n --rawfile rules rules.txt --arg content "$content" \
            '{model: "claude-sonnet-5",
              max_tokens: 300,
              system: $rules,
              messages: [{role: "user", content: $content}]}' > request.json

          # OAuth tokens go on Authorization: Bearer with the oauth beta
          # header. x-api-key is for API keys and 401s with this one.
          code=$(curl -sS -o response.json -w '%{http_code}' \
            https://api.anthropic.com/v1/messages \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: oauth-2025-04-20" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            --data @request.json)

          if [ "$code" != "200" ]; then
            echo "::error::Anthropic API returned HTTP $code"
            jq -r '.error.message? // .error.type? // "no error body"' response.json 2>/dev/null \
              || head -c 500 response.json
            exit 1
          fi

          jq -r '.content[] | select(.type == "text") | .text' response.json \
            > classification.json
          cat classification.json

      - name: Read the classification
        id: result
        if: always()
        run: |
          set -euo pipefail
          kind=$(jq -r '.classification? // empty' classification.json 2>/dev/null || true)
          echo "classification=${kind:-none}" >> "$GITHUB_OUTPUT"

      - name: Open an issue for whisp-app questions
        id: open
        if: steps.result.outputs.classification == 'whisp-app'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh label create forum      --repo "$REPO" --color 0E8A16 \
            --description "Raised on the Open Foris support forum" 2>/dev/null || true
          gh label create whisp-app  --repo "$REPO" --color 1D76DB \
            --description "Belongs to this repository" 2>/dev/null || true

          printf '\n\n---\n\n**Triage:** whisp-app -- %s\n' \
            "$(jq -r '.reason // ""' classification.json)" >> issue_body.md

          issue_url=$(gh issue create --repo "$REPO" \
            --title "[forum] ${{ steps.question.outputs.title }}" \
            --body-file issue_body.md \
            --label forum --label whisp-app)
          echo "Opened $issue_url"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"

          # Dispatched because GITHUB_TOKEN cannot fire `on: issues`.
          gh workflow run code-review.yml \
            --repo "$REPO" \
            --field issue_number="${issue_url##*/}" \
            --field mode=report
          echo "Dispatched code review for ${issue_url##*/}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Forum Triage -- forum#${{ inputs.question_id }}"
            echo ""
            echo "[${{ steps.question.outputs.title }}](${{ steps.question.outputs.url }})"
            echo ""
            echo '```json'
            cat classification.json 2>/dev/null || echo "<no result>"
            echo '```'
            if [ -n "${{ steps.open.outputs.issue_url }}" ]; then
              echo ""
              echo "Issue: ${{ steps.open.outputs.issue_url }}"
            else
              echo ""
              echo "_Not whisp-app (\`${{ steps.result.outputs.classification }}\`) -- no issue opened._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

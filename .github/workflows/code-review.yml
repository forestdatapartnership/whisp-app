name: Code Review

# Step 3 of 3, and usable on its own: answers a question about this codebase.
#
# Forum Triage dispatches this directly. Otherwise run it by hand, or label
# an issue `code-review` -- the label is the opt-in, so issues filed by hand
# are left alone until you ask.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      question:
        description: 'Question about the code. Leave blank to just use the issue.'
        required: false
      issue_number:
        description: 'Issue to read and comment on. Blank = answer in the run summary.'
        required: false
      mode:
        description: 'report = answer only | fix = may also apply a small, obvious fix and open a PR'
        type: choice
        options:
          - report
          - fix
        default: report
        required: false

concurrency:
  group: code-review-${{ inputs.issue_number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  ISSUE: ${{ inputs.issue_number || github.event.issue.number }}

jobs:
  review:
    # Every route in is someone asking on purpose.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'code-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Settle the mode
        id: guard
        env:
          MODE: ${{ inputs.mode }}
          QUESTION: ${{ inputs.question }}
        run: |
          set -euo pipefail

          # Unset when a label triggered the run; answering is the safe default.
          mode="${MODE:-report}"
          case "$mode" in
            report|fix) ;;
            *) echo "::error::unknown mode '$mode'"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          # Belt and braces: the prompt forbids changes in report mode, this
          # removes the tool, and the last step fails the job if one landed.
          if [ "$mode" = "report" ]; then
            echo "extra_args=--disallowedTools Edit,NotebookEdit" >> "$GITHUB_OUTPUT"
          else
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "${QUESTION//[[:space:]]/}" ] && [ -z "${ISSUE:-}" ]; then
            echo "::error::give a question, an issue number, or both"
            exit 1
          fi

          echo "Reviewing ${ISSUE:+#$ISSUE }(mode=$mode)."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assemble the task
        id: task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the
          # script, so a question containing quotes or $(...) stays text.
          QUESTION: ${{ inputs.question }}
        run: |
          set -euo pipefail

          # Scratch files must never end up in a `fix`-mode pull request.
          printf '%s\n' answer.md task.md issue.json >> .git/info/exclude

          : > task.md

          if [ -n "${ISSUE:-}" ]; then
            gh issue view "$ISSUE" \
              --repo "${{ github.repository }}" \
              --json number,title,body,labels,url \
              > issue.json
            jq -r '"#\(.number) \(.title)"' issue.json
            {
              echo "## Issue #$(jq -r .number issue.json): $(jq -r .title issue.json)"
              echo ""
              jq -r '.body' issue.json
            } >> task.md
            {
              echo "title=$(jq -r .title issue.json)"
              echo "url=$(jq -r .url issue.json)"
            } >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${QUESTION//[[:space:]]/}" ]; then
            {
              if [ -n "${ISSUE:-}" ]; then printf '\n---\n\n'; fi
              echo "## Question"
              echo ""
              printf '%s\n' "$QUESTION"
            } >> task.md
          fi

          echo "--- task.md ---"
          cat task.md

      - name: Investigate
        uses: anthropics/claude-code-action@v1
        with:
          # Dispatched runs are actored by a bot, which the action rejects
          # unless named. Not '*' -- on a public repo that admits any App.
          allowed_bots: github-actions[bot]
          # Do not add anthropic_api_key alongside this: an empty-but-set
          # ANTHROPIC_API_KEY outranks it and auth fails before any model call.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            ${{ steps.guard.outputs.extra_args }}
          prompt: |
            Read `task.md` in the working directory. It is what you have been
            asked about -- a GitHub issue, a free-form question, or both. When
            it carries both, the question is the specific thing wanted and the
            issue is its context. Answer what is actually asked: it may be a
            bug report, but it may equally be "how does X work", "where is Y
            done", or "is Z safe to change".

            Read `AGENTS.md` at the repository root first. It says what this
            repository owns, what belongs to other projects, how to verify a
            change, and the constraints you work under. Follow it.

            ## Investigate

            1. Find the code that actually governs what you were asked about.
               Search the repo -- never guess at file names.
            2. Read enough of it to be sure. If the task describes a problem,
               work out which this is: a real defect, a configuration problem,
               expected behaviour the reporter misunderstood, or something not
               reproducible from what they wrote.
            3. If the answer lies in `openforis-whisp` or in the map viewer
               rather than this repo, say so and stop. That is a useful answer.

            ## Answer

            Write your answer to `answer.md` in the working directory. This is
            required -- it is the only thing that gets published, and an empty
            file means the run reported nothing.

            Markdown, and in it:

            - the answer itself: what is happening and why, or how the thing
              works, whichever was asked
            - the specific files and lines, written as `path/to/file.ts:42`
            - what you would change, or precisely what information is missing
            - your confidence, and what would raise it

            Be concrete and brief. Do not restate the question back. No filler,
            no praise, no summary of what you searched.

            ## What you may do: **${{ steps.guard.outputs.mode }}**

            `report` -- investigate and answer, nothing else. Do not edit,
            create or delete any file in the repository, do not commit, do not
            push, do not open a pull request. `answer.md` is the only file you
            write, and the job fails if a tracked file changed.

            `fix` -- everything `report` does, and you may additionally apply
            the change and open a pull request, but ONLY when every one of
            these holds:

              - you traced the behaviour to specific code and are confident in
                the cause, AND
              - the change is small, self-contained, and obviously correct to
                anyone reading the diff, AND
              - it alters neither public API shape, database schema or
                migrations, authentication, nor analysis results, AND
              - it needs no new dependency, no new configuration or secret, and
                no rework of a surrounding design, AND
              - you are not guessing at anyone's intent.

            Anything beyond that is an advanced fix. Never apply one -- not on
            a branch, not as a draft, not "to show what I mean". Describe it in
            `answer.md` and say why you stopped. A wrong PR costs more than no
            PR, and that holds however plainly the change seems needed.

            If you do open one: branch from `main`, keep the diff minimal, and
            write a description stating the root cause and exactly what
            changed. Title it `fix: <short description>`, ending in
            ` (#${{ env.ISSUE }})` when that issue number is not blank. Do not
            merge it. Mention the PR in `answer.md`, and run the checks
            `AGENTS.md` lists before you open it.

      - name: Verify report mode changed nothing
        if: steps.guard.outputs.mode == 'report'
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=no)
          if [ -n "$changed" ]; then
            echo "::error::report mode modified tracked files:"
            echo "$changed"
            git checkout -- .
            exit 1
          fi
          echo "Working tree clean."

      - name: Publish the answer
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -s answer.md ]; then
            echo "::warning::no answer.md was written"
            echo "_Code Review produced no answer -- check the Investigate step._" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "${ISSUE:-}" ]; then
            gh issue comment "$ISSUE" \
              --repo "${{ github.repository }}" \
              --body-file answer.md
            echo "Commented on #${ISSUE}"
          fi

          {
            echo "### Code Review (${{ steps.guard.outputs.mode }})"
            echo ""
            if [ -n "${ISSUE:-}" ]; then
              echo "[#${ISSUE} ${{ steps.task.outputs.title }}](${{ steps.task.outputs.url }})"
              echo ""
            fi
            cat answer.md
          } >> "$GITHUB_STEP_SUMMARY"

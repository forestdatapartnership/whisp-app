name: Deploy to GKE

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: development
        type: choice
        options:
          - development
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < .version)
          [ -n "$VERSION" ] || { echo "Missing .version"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}

      - name: Verify images exist
        run: |
          REGISTRY="${{ vars.REGISTRY }}/${{ vars.PROJECT_ID }}/${{ vars.REPOSITORY }}"
          VERSION="${{ steps.version.outputs.version }}"
          for IMAGE in whisp-app whisp-api whisp-db-migrate; do
            IMAGE_REF="${REGISTRY}/${IMAGE}:${VERSION}"
            echo "Checking ${IMAGE_REF}"
            gcloud artifacts docker images describe "${IMAGE_REF}" >/dev/null || {
              echo "Image not found: ${IMAGE_REF}"
              exit 1
            }
          done

      - name: Deploy
        env:
          GKE_NAMESPACE: ${{ vars.GKE_NAMESPACE }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_REGISTRY: ${{ vars.REGISTRY }}/${{ vars.PROJECT_ID }}/${{ vars.REPOSITORY }}
          CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GKE_LB_STATIC_IP_NAME: ${{ vars.GKE_LB_STATIC_IP_NAME }}
          HOST_URL: ${{ vars.HOST_URL }}
          APP_DB_NAME: ${{ toJSON(vars.APP_DB_NAME) }}
          APP_DB_MIN_POOL_SIZE: ${{ toJSON(vars.APP_DB_MIN_POOL_SIZE) }}
          APP_DB_MAX_POOL_SIZE: ${{ toJSON(vars.APP_DB_MAX_POOL_SIZE) }}
          APP_KEYCLOAK_ISSUER: ${{ toJSON(vars.APP_KEYCLOAK_ISSUER) }}
          APP_KEYCLOAK_CLIENT_ID: ${{ toJSON(vars.APP_KEYCLOAK_CLIENT_ID) }}
          APP_KEYCLOAK_SCOPE: ${{ toJSON(vars.APP_KEYCLOAK_SCOPE) }}
          APP_EMAIL_SERVICE: ${{ toJSON(vars.APP_EMAIL_SERVICE) }}
          APP_EMAIL_FROM: ${{ toJSON(vars.APP_EMAIL_FROM) }}
          APP_NEXT_PUBLIC_ASYNC_THRESHOLD: ${{ toJSON(vars.APP_NEXT_PUBLIC_ASYNC_THRESHOLD) }}
          APP_CARTO_BASEMAP_KEY: ${{ toJSON(vars.APP_CARTO_BASEMAP_KEY) }}
          APP_MAX_MAP_FEATURES: ${{ toJSON(vars.APP_MAX_MAP_FEATURES) }}
          APP_MAX_REQUEST_BODY_SIZE_KB: ${{ toJSON(vars.APP_MAX_REQUEST_BODY_SIZE_KB) }}
          APP_MAX_PLOT_AREA_HA: ${{ toJSON(vars.APP_MAX_PLOT_AREA_HA) }}
          APP_GEOMETRY_LIMIT_SYNC: ${{ toJSON(vars.APP_GEOMETRY_LIMIT_SYNC) }}
          APP_GEOMETRY_LIMIT_ASYNC: ${{ toJSON(vars.APP_GEOMETRY_LIMIT_ASYNC) }}
          APP_ANALYSIS_TIMEOUT_SYNC_SECONDS: ${{ toJSON(vars.APP_ANALYSIS_TIMEOUT_SYNC_SECONDS) }}
          APP_ANALYSIS_TIMEOUT_ASYNC_SECONDS: ${{ toJSON(vars.APP_ANALYSIS_TIMEOUT_ASYNC_SECONDS) }}
          APP_GEOID_BASE_URL: ${{ toJSON(vars.APP_GEOID_BASE_URL) }}
          APP_GEOID_RESOLVE_CONCURRENCY: ${{ toJSON(vars.APP_GEOID_RESOLVE_CONCURRENCY) }}
          APP_ALLOWED_ORIGINS: ${{ toJSON(vars.APP_ALLOWED_ORIGINS) }}
          APP_PII_RETENTION_DAYS: ${{ toJSON(vars.APP_PII_RETENTION_DAYS) }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_KEYCLOAK_CLIENT_SECRET: ${{ secrets.APP_KEYCLOAK_CLIENT_SECRET }}
          APP_EMAIL_USER: ${{ secrets.APP_EMAIL_USER }}
          APP_EMAIL_PASS: ${{ secrets.APP_EMAIL_PASS }}
          APP_GRAFANA_ADMIN_USER: ${{ secrets.APP_GRAFANA_ADMIN_USER }}
          APP_GRAFANA_ADMIN_PASSWORD: ${{ secrets.APP_GRAFANA_ADMIN_PASSWORD }}
          APP_GEE_CREDENTIALS: ${{ secrets.APP_GEE_CREDENTIALS }}
        run: |
          set -euo pipefail
          VERSION_SLUG=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]' | tr '.+' '-')
          export VERSION_SLUG
          INGRESS_HOST="${HOST_URL#https://}"
          INGRESS_HOST="${INGRESS_HOST#http://}"
          INGRESS_HOST="${INGRESS_HOST%%/*}"
          export INGRESS_HOST
          export DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Secrets are base64-encoded for the Secret's data field. Quoting them with toJSON instead
          # would change their text, and GitHub would no longer mask them in this log.
          for name in $(grep -o 'APP_[A-Z0-9_]*' infra/k8s/00.05-app-secrets.yaml | sort -u); do
            export "$name=$(printf '%s' "${!name}" | base64 -w0)"
          done
          VARS='$GKE_NAMESPACE $ENVIRONMENT $VERSION $VERSION_SLUG $IMAGE_REGISTRY $CLOUDSQL_INSTANCE $GCP_SERVICE_ACCOUNT $GKE_LB_STATIC_IP_NAME $HOST_URL $INGRESS_HOST $DEPLOYED_AT'
          VARS="$VARS $(grep -oh '\${APP_[A-Z0-9_]*}' infra/k8s/*.yaml | sort -u | tr '\n' ' ')"
          OUT=/tmp/k8s
          mkdir -p "$OUT"
          for f in infra/k8s/[0-9]*.yaml; do
            envsubst "$VARS" < "$f" > "$OUT/$(basename "$f")"
          done

          shopt -s nullglob
          for tier in 00 01 02 03 04 05 06 07 08 09; do
            if [ "$tier" = "02" ]; then
              for f in "$OUT/${tier}."*.yaml; do
                grep -q '^apiVersion:' "$f" || continue
                kubectl delete -f "$f" --ignore-not-found
              done
            fi
            for f in "$OUT/${tier}."*.yaml; do
              grep -q '^apiVersion:' "$f" || continue
              kubectl apply -f "$f"
            done
            case $tier in
              01|03) kubectl wait --for=condition=available deployment --all -n "$GKE_NAMESPACE" --timeout=300s ;;
              02)
                kubectl wait --for=condition=complete job --all -n "$GKE_NAMESPACE" --timeout=300s &
                wp=$!
                while kill -0 $wp 2>/dev/null; do
                  kubectl get job -n "$GKE_NAMESPACE" -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Failed")].status}{"\n"}{end}' | grep -qx True && {
                    kill $wp 2>/dev/null || true
                    wait $wp 2>/dev/null || true
                    kubectl get job -n "$GKE_NAMESPACE"
                    exit 1
                  }
                  sleep 2
                done
                wait $wp
                ;;
            esac
          done

name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Which version segment to bump: major, minor, or patch'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.vars.outputs.release_branch }}
      mode: ${{ steps.vars.outputs.mode }}
    permissions:
      contents: write     
      issues: read        
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - id: vars
        run: |
          BRANCH="${{ github.ref_name || 'main' }}"

          if [ "$BRANCH" = "main" ]; then
            MODE="create"
            VER=$(tr -d '[:space:]' < .version)
            [ -n "$VER" ] || { echo "Missing .version" >&2; exit 1; }
            TAG="v$VER"
            RELEASE_BRANCH="release/$TAG"
          elif echo "$BRANCH" | grep -q "^release/"; then
            MODE="update"
            TAG="${BRANCH#release/}"
            VER="${TAG#v}"
            RELEASE_BRANCH="$BRANCH"
          else
            echo "Unsupported branch $BRANCH" >&2
            exit 1
          fi

          echo "MODE=$MODE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VER=$VER" >> $GITHUB_ENV
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV
          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Ensure release exists (update mode)
        if: ${{ steps.vars.outputs.mode == 'update' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null

      - name: Ensure release branch
        if: ${{ steps.vars.outputs.mode == 'create' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "$RELEASE_BRANCH"; then
            git fetch origin "$RELEASE_BRANCH"
          else
            git branch "$RELEASE_BRANCH" "$GITHUB_SHA"
            git push origin "$RELEASE_BRANCH:$RELEASE_BRANCH"
          fi

      - name: Retag release branch head (update mode)
        if: ${{ steps.vars.outputs.mode == 'update' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$RELEASE_BRANCH" || { echo "Release branch $RELEASE_BRANCH not found" >&2; exit 1; }
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" || true
          git checkout "$RELEASE_BRANCH"
          git tag -a "$TAG" -m "Update release $TAG"
          git push origin "$TAG"

      - name: Gather release context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh issue list --state closed --milestone "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --limit 200 \
                --json number,title,body > issues.json; then
            echo "::warning::no milestone $TAG, or the issue list failed"
            echo '[]' > issues.json
          fi

          jq -r '.[] | "- " + .title + " (#" + (.number|tostring) + ")"' \
            issues.json > issues.md
          echo "issue_count=$(jq length issues.json)" >> "$GITHUB_OUTPUT"

          # In update mode this tag already has a release; skip it.
          : > previous.md
          shown=0
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 \
                      --json tagName --jq '.[].tagName'); do
            [ "$t" = "$TAG" ] && continue
            [ "$shown" -ge 3 ] && break
            {
              echo "### $t"
              echo
              gh release view "$t" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
                | awk '/^---$/{exit} {print}'
              echo
            } >> previous.md
            shown=$((shown + 1))
          done

          {
            echo "# Release $TAG"
            echo
            echo "## Issues closed in this milestone"
            echo
            jq -r '.[] | "### #\(.number) \(.title)", "",
                       ((.body // "") | .[0:1500]), ""' issues.json
            echo
            echo "## The last releases, for tone"
            echo
            cat previous.md
          } > context.md

          cat context.md

      - name: Draft the What's New section
        if: ${{ steps.context.outputs.issue_count != '0' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 6
            --allowedTools Read,Write
          prompt: |
            Read `context.md` in the working directory: the issues closed in
            this release's milestone, followed by the What's New section of
            each of the last releases.

            Write this release's What's New section into `whats_new.md`. That
            file is your entire output: no heading, no preamble, nothing else.

            Match the last releases. Their length, their voice and their shape
            are the specification -- read them and write what fits alongside
            them, rather than imposing a shape of your own.

            The closed issues are listed under this section in the published
            notes, so do not enumerate them or repeat their titles and
            numbers. Say what the release amounts to for someone using Whisp,
            and leave out what nobody outside the team would notice:
            refactors, dependency bumps, CI and build work.

      - id: notes
        run: |
          set -euo pipefail

          {
            echo "## 🚀 What's New"
            echo
            if [ -s whats_new.md ]; then
              cat whats_new.md
              echo
            fi
            echo "---"
            echo
            echo "## 🔧 Issues Resolved in This Release"
            echo
            if [ -s issues.md ]; then
              cat issues.md
            else
              echo "No closed issues in this milestone."
            fi
          } > RELEASE_NOTES.md

          echo "NOTES_PATH=RELEASE_NOTES.md" >> $GITHUB_ENV
          cat RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.vars.outputs.mode == 'create' }}
        run: |
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file "$NOTES_PATH" \
            --target "$RELEASE_BRANCH"

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.vars.outputs.mode == 'update' }}
        run: |
          gh release edit "$TAG" \
            --tag "$TAG" \
            --notes-file "$NOTES_PATH" \
            --draft=false \
            --latest

      - name: Bump .version (major/minor/patch)
        if: ${{ steps.vars.outputs.mode == 'create' }}
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump-type || 'patch' }}"
          CURRENT=$(tr -d '[:space:]' < .version)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump type: $BUMP_TYPE" >&2; exit 1 ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > .version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}